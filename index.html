  <script src="/_sdk/fef09cb5f5b2424b.editing_sdk.js" integrity="sha512-PbmCvZWt+xecnQll4ofK5HTtTS+pGwwY1xn9+p49qHgEHml+uvyc0o1f2Eltkd4t324iwgnf7acUjfnKHkik1w=="></script>
  <script>
    const pests = [
      { key: "anticarsia", label: "Anticarsia", group: "Plagas" },
      { key: "falsa_medidora", label: "Falsa medidora", group: "Plagas" },
      { key: "chinche_marron", label: "Chinche marrón", group: "Plagas" },
      { key: "chinche_verde", label: "Chinche verde", group: "Plagas" },
      { key: "pulgon", label: "Pulgón", group: "Plagas" },
      { key: "vaquita_defoliadora", label: "Vaquita defoliadora (Ceratoma)", group: "Plagas" },
      { key: "mariquita", label: "Mariquita", group: "Control biológico" },
      { key: "crisopas", label: "Crisopas", group: "Control biológico" },
      { key: "avispitas", label: "Avispitas", group: "Control biológico" }
    ];

    let records = [];
    let saving = false;

    function makeRow(pest, index) {
      const row = document.createElement("tr");
      if (index === 6) {
        const divider = document.createElement("tr");
        divider.innerHTML = '<td colspan="13" class="bg-[#f7f2e5] px-5 py-2 text-xs font-bold uppercase tracking-[.14em] text-[#806638]">Control biológico</td>';
        document.getElementById("sampling-body").appendChild(divider);
      }
      row.dataset.key = pest.key;
      row.innerHTML = `
        <td class="sticky left-0 z-10 bg-white px-5 py-3 text-sm font-bold text-[#314d34]">${pest.label}</td>
        ${Array.from({length:10}, (_, i) => `<td class="px-1 py-2 text-center"><input class="sample-input" aria-label="${pest.label}, punto ${i + 1}" inputmode="decimal" min="0" type="number"></td>`).join("")}
        <td class="total-cell px-3 py-2 text-center">0</td>
        <td class="px-3 py-2 text-center"><span class="avg-pill">0,0</span></td>`;
      document.getElementById("sampling-body").appendChild(row);
      row.querySelectorAll("input").forEach(input => input.addEventListener("input", () => updateRow(row)));
    }

    function updateRow(row) {
      const values = [...row.querySelectorAll("input")].map(input => Number(input.value) || 0);
      const total = values.reduce((sum, value) => sum + value, 0);
      row.querySelector(".total-cell").textContent = total;
      row.querySelector(".avg-pill").textContent = (total / 10).toLocaleString("es-BO", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    function getPestValues(key) {
      const row = document.querySelector(`tr[data-key="${key}"]`);
      return [...row.querySelectorAll("input")].map(input => input.value === "" ? "0" : input.value).join(",");
    }

    function setMessage(message, type) {
      const target = document.getElementById("form-message");
      target.textContent = message;
      target.className = "min-h-5 text-sm font-medium " + (type === "error" ? "text-[#ae452f]" : "text-[#547254]");
    }

    function formatReadings(value) {
      return String(value || "").split(",").map(v => Number(v) || 0);
    }

    function summaryTotal(record, key) {
      return formatReadings(record[key]).reduce((a, b) => a + b, 0);
    }

    function createCard(record) {
      const fragment = document.getElementById("history-card-template").content.cloneNode(true);
      const card = fragment.querySelector("article");
      card.dataset.recordId = record.__backendId;
      card.querySelector(".history-property").textContent = record.propiedad || "Propiedad sin nombre";
      card.querySelector(".history-meta").textContent = `${record.lote || "Lote sin identificar"} · ${record.responsable || "Sin responsable"}${record.hectareas ? " · " + record.hectareas + " ha" : ""}`;
      card.querySelector(".history-date").textContent = record.fecha ? new Date(record.fecha + "T12:00:00").toLocaleDateString("es-BO") : "Sin fecha";

      const principal = pests.slice(0, 3);
      card.querySelector(".history-summary").innerHTML = principal.map(pest =>
        `<div class="rounded-xl bg-[#f2f7ed] px-3 py-2"><p class="text-[10px] font-bold uppercase tracking-wide text-[#6d856b]">${pest.label}</p><p class="mt-1 text-lg font-bold text-[#315e37]">${summaryTotal(record, pest.key)}</p></div>`
      ).join("");

      const details = card.querySelector(".history-details");
      details.innerHTML = `<div class="grid grid-cols-1 gap-2 sm:grid-cols-2">${pests.map(pest => {
        const readings = formatReadings(record[pest.key]);
        const total = readings.reduce((a,b) => a+b, 0);
        return `<div class="rounded-lg bg-[#fafcf8] px-3 py-2 text-sm"><span class="font-semibold text-[#405d42]">${pest.label}</span><span class="float-right font-bold text-[#315e37]">${total} <small class="font-normal text-[#71836f]">/ prom. ${(total/10).toLocaleString("es-BO",{minimumFractionDigits:1,maximumFractionDigits:1})}</small></span></div>`;
      }).join("")}</div>`;

      const button = card.querySelector("button");
      button.addEventListener("click", () => {
        const open = details.classList.toggle("hidden");
        button.setAttribute("aria-expanded", String(!open));
      });
      return card;
    }

    function renderRecords(data) {
      records = data;
      const list = document.getElementById("history-list");
      const existing = new Map([...list.children].map(card => [card.dataset.recordId, card]));
      data.slice().sort((a,b) => String(b.fecha).localeCompare(String(a.fecha))).forEach(record => {
        const oldCard = existing.get(record.__backendId);
        if (oldCard) {
          const newCard = createCard(record);
          oldCard.replaceWith(newCard);
          existing.delete(record.__backendId);
        } else {
          list.appendChild(createCard(record));
        }
      });
      existing.forEach(card => card.remove());
      document.getElementById("record-count").textContent = data.length;
      document.getElementById("empty-history").classList.toggle("hidden", data.length > 0);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      pests.forEach(makeRow);
      lucide.createIcons();

      const initResult = await window.dataSdk.init({
        onDataChanged(data) {
          renderRecords(data);
          lucide.createIcons();
        }
      });
      if (!initResult.isOk) setMessage("No fue posible cargar los registros guardados.", "error");

      document.getElementById("clear-button").addEventListener("click", () => {
        document.getElementById("monitoring-form").reset();
        document.querySelectorAll("#sampling-body tr[data-key]").forEach(updateRow);
        setMessage("La planilla está lista para un nuevo monitoreo.", "success");
      });

      document.getElementById("monitoring-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (saving) return;

        const form = event.currentTarget;
        if (!form.reportValidity()) {
          setMessage("Completá los datos obligatorios del monitoreo.", "error");
          return;
        }
        if (records.length >= 999) {
          setMessage("Se alcanzó el máximo de 999 registros. Eliminá un registro antes de guardar otro.", "error");
          return;
        }

        saving = true;
        const button = document.getElementById("save-button");
        button.disabled = true;
        button.classList.add("opacity-60", "cursor-wait");
        setMessage("Guardando monitoreo en la planilla…", "success");

        const data = new FormData(form);
        const record = {
          propiedad: data.get("propiedad"),
          responsable: data.get("responsable"),
          lote: data.get("lote"),
          hectareas: data.get("hectareas"),
          fecha: data.get("fecha"),
          etapa_v: data.get("etapa_v"),
          etapa_r: data.get("etapa_r"),
          variedad: data.get("variedad"),
          anticarsia: getPestValues("anticarsia"),
          falsa_medidora: getPestValues("falsa_medidora"),
          chinche_marron: getPestValues("chinche_marron"),
          chinche_verde: getPestValues("chinche_verde"),
          pulgon: getPestValues("pulgon"),
          vaquita_defoliadora: getPestValues("vaquita_defoliadora"),
          mariquita: getPestValues("mariquita"),
          crisopas: getPestValues("crisopas"),
          avispitas: getPestValues("avispitas")
        };

        const result = await window.dataSdk.create(record);
        saving = false;
        button.disabled = false;
        button.classList.remove("opacity-60", "cursor-wait");

        if (result.isOk) {
          setMessage("Monitoreo guardado correctamente.", "success");
          form.reset();
          document.querySelectorAll("#sampling-body tr[data-key]").forEach(updateRow);
        } else {
          setMessage("No se pudo guardar el monitoreo. Intentá nuevamente.", "error");
        }
      });
    });
  </script>
 </body>
</html>
